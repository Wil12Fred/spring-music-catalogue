name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: IS1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/IS1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - run: ./mvnw -B -ntp verify
      - name: Start the packaged app and request two pages
        run: |
          java -jar target/app-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done
          grep -m1 "Started SpotifyApplication" app.log
          curl -s -o /dev/null -w "GET / -> %{http_code}\n" http://localhost:8080/
          curl -s -X POST -d nombre=Soda+Stereo -o /dev/null -w "POST /artista -> %{http_code}\n" http://localhost:8080/artista
          curl -s http://localhost:8080/artista | grep -o "<td>Soda Stereo</td>"
